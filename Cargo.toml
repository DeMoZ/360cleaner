[package]
name = "cleaner360"
version = "0.2.0"
edition = "2021"
authors = ["Roman <DeMoZ>"]
description = "Fast 360 Photo Person Remover in Rust without AI"

[dependencies]
tao = "0.37"
wry = "0.57"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
