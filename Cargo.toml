[package]
name = "cleaner360"
version = "0.4.0"
edition = "2024"
authors = ["DeMoZ"]
description = "Убирает фотографа и людей с 360° панорамы по двум кадрам, без нейросетей"
repository = "https://github.com/DeMoZ/360cleaner"
license = "MIT"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rfd = "0.15"
sha2 = "0.10"
sys-locale = "0.3"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
fast_image_resize = { version = "6.1.0", features = ["rayon"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
